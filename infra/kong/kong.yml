_format_version: "3.0"

# ─────────────────────────────────────────────────────────────────────────────
# CORS STRATEGY: Kong Gateway handles CORS centrally.
# We enable the Kong CORS plugin globally and disable the Go Gin CORS middleware
# to prevent duplicate CORS headers which cause browsers to block requests.
# ─────────────────────────────────────────────────────────────────────────────

plugins:
  - name: cors
    config:
      origins:
        - https://frontend-producttrace-ai.vercel.app
        - http://localhost:5173
        - http://localhost:3000
        - http://localhost:3001
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Origin
        - Content-Type
        - Authorization
        - Accept
        - ngrok-skip-browser-warning
      credentials: true
      preflight_continue: false

services:
  - name: go-core-service
    url: http://go-core-service:8080

    routes:
      - name: go-core-route
        paths:
          - /api
        strip_path: false

  - name: nest-ai-service
    url: http://nest-ai-service:3000

    routes:
      - name: nest-ai-route
        paths:
          - /ai
        strip_path: false