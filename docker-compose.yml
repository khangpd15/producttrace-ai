
services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: product-trace-db

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_EXTERNAL_PORT}:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - app-networks

  redis:
    image: redis:8-alpine
    container_name: product-trace-redis

    ports:
      - "${REDIS_PORT}:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

    networks:
      - app-networks

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: product-trace-rabbitmq

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}

    ports:
      - "${RABBITMQ_PORT}:5672"
      - "15672:15672"

    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - app-networks

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: product-trace-zookeeper

    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

    ports:
      - "2181:2181"

    networks:
      - app-networks

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: product-trace-kafka

    depends_on:
      - zookeeper

    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

    ports:
      - "9092:9092"
      - "29092:29092"

    networks:
      - app-networks

  qdrant:
    image: qdrant/qdrant:v1.0.0
    container_name: product-trace-qdrant

    ports:
      - "6333:6333"

    volumes:
      - qdrant-data:/qdrant/storage

    networks:
      - app-networks

  embedding-service:
    build:
      context: ./apps/nest-ai-service/embedding-service
      dockerfile: Dockerfile

    container_name: product-trace-embedding-service

    ports:
      - "8000:8000"

    environment:
      MODEL_NAME: 'bge-m3'

    networks:
      - app-networks

  migrate:
    image: migrate/migrate
    container_name: product-trace-migrate

    volumes:
      - ./migrations:/migrations:ro

    command:
      [
        "-path",
        "/migrations",
        "-database",
        "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable",
        "up"
      ]

    restart: on-failure

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - app-networks

  go-core-service:
    build:
      context: ./apps/go-core-service
      dockerfile: Dockerfile

    container_name: go-core-service

    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}

      RABBITMQ_URL: ${RABBITMQ_URL}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE}

    ports:
      - "${GO_CORE_PORT}:8080"

    depends_on:
      migrate:
        condition: service_completed_successfully

      redis:
        condition: service_healthy

      rabbitmq:
        condition: service_healthy

    networks:
      - app-networks

  nest-ai-service:
    build:
      context: ./apps/nest-ai-service
      dockerfile: Dockerfile

    container_name: nest-ai-service

    environment:
      PORT: ${NEST_PORT}

      GO_CORE_URL: ${GO_CORE_URL}

      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}

      RABBITMQ_URL: amqp://admin:admin123@rabbitmq:5672/
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE}
      RABBITMQ_QUEUE: ai.events
      KAFKA_BROKER: kafka:9092
      KAFKA_GROUP_ID: nest-ai-service-group
      QDRANT_URL: http://qdrant:6333
      EMBEDDING_SERVICE_URL: http://embedding-service:8000

    ports:
      - "${NEST_PORT}:3000"

    depends_on:
      go-core-service:
        condition: service_started

      redis:
        condition: service_healthy

      rabbitmq:
        condition: service_healthy

      kafka:
        condition: service_started

      qdrant:
        condition: service_started

      embedding-service:
        condition: service_started

    networks:
      - app-networks

networks:
  app-networks:
    name: app-networks
    driver: bridge

volumes:
  postgres-data:
  rabbitmq-data:
  qdrant-data:

