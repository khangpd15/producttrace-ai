
services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: product-trace-db

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - app-networks

  redis:
    image: redis:8-alpine
    container_name: product-trace-redis

    ports:
      - "${REDIS_PORT}:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

    networks:
      - app-networks

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: product-trace-rabbitmq
    hostname: rabbitmq

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}

    ports:
      - "5672:5672"
      - "15672:15672"

    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

    networks:
      - app-networks

  migrate:
    image: migrate/migrate
    container_name: product-trace-migrate

    volumes:
      - ./migrations:/migrations:ro

    command:
      [
        "-path",
        "/migrations",
        "-database",
        "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable",
        "up"
      ]

    restart: on-failure

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - app-networks

  go-core-service:
    build:
      context: ./apps/go-core-service
      dockerfile: Dockerfile

    container_name: go-core-service

    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}

      RABBITMQ_URL: ${RABBITMQ_URL}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE}
      GIN_MODE: release

    ports:
      - "${GO_CORE_PORT}:8080"

    depends_on:
      migrate:
        condition: service_completed_successfully

      redis:
        condition: service_healthy

      rabbitmq:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

    networks:
      - app-networks

  nest-ai-service:
    build:
      context: ./apps/nest-ai-service
      dockerfile: Dockerfile

    container_name: nest-ai-service

    environment:
      PORT: ${NEST_PORT}

      GO_CORE_URL: ${GO_CORE_URL}

      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}

      RABBITMQ_URL: ${RABBITMQ_URL}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE}

      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      FROM_EMAIL: ${FROM_EMAIL}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL}
      WELCOME_TEMPLATE_ID: ${WELCOME_TEMPLATE_ID}
      WELCOME_EMAIL_TEMPLATE_ID: ${WELCOME_EMAIL_TEMPLATE_ID}
      VERIFY_EMAIL_TEMPLATE_ID: ${VERIFY_EMAIL_TEMPLATE_ID}

    ports:
      - "${NEST_PORT}:3000"

    depends_on:
      go-core-service:
        condition: service_healthy

      redis:
        condition: service_healthy

      rabbitmq:
        condition: service_healthy

    networks:
      - app-networks

networks:
  app-networks:
    name: app-networks
    driver: bridge

volumes:
  postgres-data:
  rabbitmq-data:

