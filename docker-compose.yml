services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: product-trace-ai
    environment:
      POSTGRES_DB: product_trace_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d product_trace_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: product_trace_redis
    ports:
      - "6379:6379"

  migrate:
    image: migrate/migrate
    volumes:
      - ./migrations:/migrations
    command:
      [
        "-path",
        "/migrations",
        "-database",
        "postgres://postgres:123456@postgres:5432/product_trace_db?sslmode=disable",
        "up"
      ]
    depends_on:
      postgres:
        condition: service_healthy