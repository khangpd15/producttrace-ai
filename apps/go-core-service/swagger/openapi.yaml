          type: string
          format: uuid
          example: 7c9e66b3-e5d8-4f10-bf91-b3b35520ee11
        batchCode:
          type: string
          example: APL-2026-0001
        status:
          type: string
          example: EXPIRED
        updatedAt:
          type: string
          format: date-time
          example: 2026-07-10T01:59:00Z
    BatchEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: e20befe6-e4b9-4f37-b514-e66233ef04a1
        title:
          type: string
          example: Lô hàng đã xuất xưởng
        description:
          type: string
          example: Đã kiểm tra chất lượng và dán nhãn
        timestamp:
          type: string
          format: date-time
          example: 2026-07-01T10:00:00Z
    ProductItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: c20befe6-e4b9-4f37-b514-e66233ef04a1
        itemCode:
          type: string
          example: APL-2026-0001-SN0001
        serialNumber:
          type: string
          example: SN0001
        status:
          type: string
          example: AVAILABLE
    GetBatchProductsResponse:
      type: object
      properties:
