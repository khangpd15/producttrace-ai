          $ref: '#/components/schemas/PaginationResponse'
    BatchHistoryItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 993fa1a0-1200-4b2e-a551-fb112aaee111
        action:
          type: string
          example: UPDATE
        entity:
          type: string
          example: Batch
        oldData:
          type: string
          example: "{\"status\": \"ACTIVE\"}"
        newData:
          type: string
          example: "{\"status\": \"EXPIRED\"}"
        userEmail:
          type: string
          example: admin@producttrace.com
        createdAt:
          type: string
          format: date-time
          example: 2026-07-10T01:59:00Z
    GetBatchHistoryResponse:
      type: object
      properties:
        batchId:
          type: string
          format: uuid
          example: 7c9e66b3-e5d8-4f10-bf91-b3b35520ee11
        batchCode:
          type: string
          example: APL-2026-0001
        history:
          type: array
          items:
            $ref: '#/components/schemas/BatchHistoryItem'
    TraceSearchResponse:
      type: object
      properties:
        productItem:
          type: object
          properties:
            itemId:
              type: string
              format: uuid
              example: c20befe6-e4b9-4f37-b514-e66233ef04a1
            itemCode:
              type: string
              example: PT-MILK-SN0001
            serialNumber:
              type: string
              example: SN0001
            status:
              type: string
              example: AVAILABLE
            productName:
              type: string
              example: Fresh Milk 1L
            thumbnailUrl:
              type: string
              example: http://localhost:8080/storage/temp/thumb.jpg
        warning:
          type: string
          example: "WARNING: This product belongs to a recalled batch. Please do not consume."
        filterApplied:
          type: object
          properties:
            fromDate:
              type: string
              format: date-time
              nullable: true
              example: 2026-07-01T00:00:00Z
            toDate:
              type: string
              format: date-time
              nullable: true
              example: 2026-07-08T00:00:00Z
            eventTypes:
              type: array
              items:
                type: string
              example: [PRODUCED, SALE]
        matchedEventsCount:
          type: integer
          example: 2
        timeline:
          type: array
          items:
            type: object
            properties:
              eventId:
                type: string
                format: uuid
                example: e20befe6-e4b9-4f37-b514-e66233ef04a2
              eventType:
                type: string
                enum: [PRODUCED, PACKED, WAREHOUSE_IN, WAREHOUSE_OUT, TRANSPORTED, SALE, REGISTERED, WARRANTY_ACTIVE, WARRANTY_CLAIM, WARRANTY_RESOLVED, RETURNED, RECALL, RECALLED]
                example: PRODUCED
              title:
                type: string
                example: Product Manufactured
              description:
                type: string
                example: Milk was packaged and pasteurized.
              location:
                type: string
                example: Lam Dong Plant
              timestamp:
                type: string
                format: date-time
                example: 2026-07-01T12:00:00Z
