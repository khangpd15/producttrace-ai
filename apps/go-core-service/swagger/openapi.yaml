        - productItemId
      properties:
        productItemId:
          type: string
          format: uuid
          example: c20befe6-e4b9-4f37-b514-e66233ef04a1
        theme:
          type: string
          enum: [CLASSIC_NAVY, WARM_MINIMAL]
          default: CLASSIC_NAVY
          example: CLASSIC_NAVY
        includeAuditLogs:
          type: boolean
          default: false
          example: true
    ExportExcelRequest:
      type: object
      properties:
        productItemId:
          type: string
          format: uuid
          example: c20befe6-e4b9-4f37-b514-e66233ef04a1
        batchId:
          type: string
          format: uuid
          example: 6f2bc881-8b21-4f10-9111-a887b2210a12
        fromDate:
          type: string
          format: date-time
          example: 2026-07-01T00:00:00Z
        toDate:
          type: string
          format: date-time
          example: 2026-07-08T23:59:59Z
    ExportJobResponse:
      type: object
      properties:
        jobId:
          type: string
          format: uuid
          example: 993fa1a0-1200-4b2e-a551-fb112aaee111
        status:
          type: string
          example: PROCESSING
        estimatedTimeSeconds:
          type: integer
          example: 3
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Invalid input parameters
        errors:
          type: object
          example: null
    PaginationResponse:
      type: object
      properties:
        total:
          type: integer
          example: 100
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        totalPages:
          type: integer
          example: 10
